const ACC=()=>S.accounts||(S.accounts=[]);
const ROLES=['Administrateur','Ventes','Achats','Comptabilité'];
let sess=null;try{sess=sessionStorage.getItem('yt_sess')||null}catch(e){}
const loginOn=()=>ACC().length>0;
const curAcc=()=>ACC().find(a=>a.id==sess);
const localAdm=()=>!loginOn()||(curAcc()&&curAcc().role=='Administrateur');
const MASKL={cost:'🙈 Coûts, prix d’achat & marges',sal:'🙈 Salaires & trésorerie',pin:'🙈 Comptes & mots de passe'};
const maskDeny=a=>{const s=new Set(),mk=new Set(a.mask||[]);if(mk.has('cost')){s.add('pnl');s.add('rent');s.add('scenario');s.add('dir')}if(mk.has('sal')){s.add('staff');s.add('tre');s.add('pnl');s.add('rent');s.add('dir')}if(mk.has('pin'))s.add('bak');return s};
const localCan=v=>{if(v=='aide')return true;if(!loginOn())return true;const a=curAcc();if(!a)return false;if(a.role=='Administrateur')return true;if(maskDeny(a).has(v))return false;const bs=new Set((RM[a.role]||'').split(' ').filter(Boolean));(a.extra||[]).forEach(x=>bs.add(x));(a.deny||[]).forEach(x=>bs.delete(x));return bs.has(v)};
const localCanEnter=v=>{if(!loginOn())return true;const a=curAcc();if(!a)return false;if(a.role=='Administrateur')return true;if(a.ro)return false;return !((a.noEntry||[]).includes(v))};
const ROLE_IC={Administrateur:'🔐',Ventes:'🛒',Achats:'📦','Comptabilité':'🧮'};
const DEFV={Administrateur:'dash',Ventes:'sales',Achats:'purchases','Comptabilité':'tre'};
function loginPanel(){const accs=ACC(),sel=accs.find(a=>a.id==ui.lgSel)?ui.lgSel:(accs[0]&&accs[0].id);
return `<div class="login-wrap"><div class="login-card"><div class="login-brand">🏬</div><h1 class="login-title">Y-TRADE &amp; SERVICES SARL</h1><p class="login-sub">Sélectionnez votre accès pour ouvrir l’application.</p>
<span class="login-lbl">Accès</span><div class="login-accs">${accs.map(a=>`<label class="login-acc"><input type="radio" name="lgacc" value="${a.id}"${a.id==sel?' checked':''}><span class="login-acc-ic">${ROLE_IC[a.role]||'👤'}</span><span class="login-acc-txt"><span class="login-acc-name">${esc(a.name)}</span><span class="login-acc-role">${esc(a.role)}</span></span></label>`).join('')}</div>
<span class="login-lbl">Mot de passe</span><input id="lgP" type="password" placeholder="Mot de passe" autofocus>
<button data-lg="in" class="login-btn">🔓 Se connecter</button>
<button data-guest="1" class="ghost login-guest">👁️ Accès visiteur (lecture seule, sans mot de passe)</button>
<p class="login-foot">L’application s’ouvre directement sur le module correspondant à l’accès choisi. L’accès visiteur donne une vue en lecture seule du tableau de bord, sans possibilité de modification.</p>
</div></div>`}
document.addEventListener('change',e=>{if(e.target&&e.target.name=='lgacc')ui.lgSel=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('[data-lg]');if(!b)return;
if(b.dataset.lg=='in'){const r=document.querySelector('input[name="lgacc"]:checked'),p=$('#lgP'),a=ACC().find(x=>x.id==(r?r.value:''));if(!a)return toast('Compte introuvable.');if(hs(p?p.value:'')!=a.pin)return toast('Mot de passe incorrect.');sess=a.id;try{sessionStorage.setItem('yt_sess',sess)}catch(e){}ui.v=DEFV[a.role]||'dash';ui.arm='';toast('✅ Bienvenue, '+a.name);render()}
else if(b.dataset.lg=='out'){sess=null;try{sessionStorage.removeItem('yt_sess')}catch(e){}ui.v='dash';toast('👋 Déconnecté');render()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='lgP')document.querySelector('[data-lg="in"]').click()});
$('header span').insertAdjacentHTML('beforeend','<button class="ghost" id="lgout" data-lg="out" style="display:none" title="Se déconnecter">🚪 Déconnexion</button>');
const ALLMOD=()=>{const s=[];NAV.forEach(g=>g[1].forEach(([k,l])=>{if(k!='aide'&&k!='acc')s.push([k,l])}));return s};
const effMod=a=>{const bs=new Set((RM[a.role]||'').split(' ').filter(Boolean));(a.extra||[]).forEach(x=>bs.add(x));(a.deny||[]).forEach(x=>bs.delete(x));return bs};
function accPanel(){const accs=ACC(),rows=accs.map(a=>{const cust=a.role!='Administrateur'?(()=>{const open=ui.pac==a.id,e=effMod(a),ne=new Set(a.noEntry||[]),mk=new Set(a.mask||[]);return `<button class="ghost" data-acx="${a.id}">${open?'▲':'🔧'} Personnaliser les accès</button>`+(open?`<div class="box" style="margin:8px 0 4px;background:var(--bg)"><p class="mute" style="margin:0 0 8px">Cochez les modules accessibles à ce compte : au-delà de ce qui est coché par défaut pour étendre l’accès, ou décochez pour le restreindre — au-delà de ce que donne le rôle « ${esc(a.role)} ».</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px">${ALLMOD().map(([k,l])=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-acm="${esc(k)}"${e.has(k)?' checked':''} style="width:auto">${esc(l)}</label>`).join('')}</div>
<p class="mute" style="margin:14px 0 8px"><b>Saisie</b> — restreindre l’ajout, la modification et la suppression de données pour ce compte.</p>
<label style="display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" data-acro="1"${a.ro?' checked':''} style="width:auto"><b>Compte en lecture seule</b> — consultation uniquement, aucune saisie possible sur aucun module</label>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px">${[...e].map(k=>{const l=(ALLMOD().find(x=>x[0]==k)||[0,k])[1];return `<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-acne="${esc(k)}"${ne.has(k)?'':' checked'} style="width:auto">${esc(l)} — saisie autorisée</label>`}).join('')}</div>
<p class="mute" style="margin:14px 0 8px"><b>Éléments sensibles</b> — masquer pour ce compte (modules et colonnes correspondants retirés de l’affichage), quels que soient les accès ci-dessus.</p>
<div style="display:grid;gap:6px">${Object.entries(MASKL).map(([k,l])=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-acmk="${k}"${mk.has(k)?' checked':''} style="width:auto">${l}</label>`).join('')}</div>
<div class="tools" style="margin-top:8px"><button data-acps="${a.id}">Enregistrer les accès</button></div></div>`:'')})():'';
return `<div style="padding:4px 0;border-bottom:1px solid var(--line)"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="min-width:140px">${esc(a.name)}${a.id==sess?' (vous)':''}</span><select data-acr="${a.id}">${ROLES.map(r=>`<option${r==a.role?' selected':''}>${r}</option>`).join('')}</select><input type="password" data-acnp="${a.id}" placeholder="Nouveau mot de passe (optionnel)" style="max-width:190px"><button class="ghost" data-acs="${a.id}">Enregistrer</button><button class="ghost" data-acrm="${a.id}">🗑️ Retirer</button></div>${cust}</div>`}).join('');
return `<div class="box" style="margin-bottom:12px"><h2>👤 Comptes &amp; accès</h2><p class="mute">${accs.length?'La connexion est activée : un identifiant et un mot de passe sont requis pour ouvrir l’application, avec un accès limité selon le rôle (Ventes, Achats, Comptabilité) ou complet (Administrateur). Pour un compte non-administrateur, ses accès peuvent en plus être étendus ou restreints individuellement via « 🔧 Personnaliser les accès » : quels modules sont visibles, si la saisie (ajout/modification/suppression) y est autorisée — globalement ou module par module —, et si certains éléments sensibles (coûts et marges, salaires et trésorerie, comptes et mots de passe) doivent lui rester masqués.':'Aucun compte défini : l’application reste ouverte sans connexion. Ajoutez un premier compte pour activer la page de connexion.'}</p>${rows}<div class="tools" style="margin-top:8px"><input id="acn" type="text" placeholder="Nom"><input id="acp" type="password" placeholder="Mot de passe"><select id="acro">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select><button data-acadd="1">➕ Ajouter le compte</button></div></div>`}
const bkA0=V.bak;V.bak=()=>accPanel()+bkA0();
document.addEventListener('click',e=>{const b=e.target.closest('[data-acadd],[data-acs],[data-acrm],[data-acx],[data-acps]');if(!b)return;if(!localAdm())return toast('Réservé à l’administrateur.');
if(b.dataset.acadd){const n=$('#acn'),p=$('#acp'),r=$('#acro'),nm=n?n.value.trim():'',pw=p?p.value:'',rl=r?r.value:ROLES[0];if(!nm)return toast('Entrez un nom.');if(!pw)return toast('Entrez un mot de passe.');ACC().push({id:id(),name:nm,role:rl,pin:hs(pw)});save();toast('✅ Compte créé');render()}
else if(b.dataset.acs){const aid=b.dataset.acs,sel=document.querySelector('select[data-acr="'+aid+'"]'),npw=document.querySelector('input[data-acnp="'+aid+'"]'),a=ACC().find(x=>x.id==aid);if(!a||!sel)return;
if(a.role=='Administrateur'&&sel.value!='Administrateur'&&ACC().filter(x=>x.role=='Administrateur').length<=1)return toast('Impossible : au moins un compte Administrateur doit exister.');
if(a.role!=sel.value){a.extra=[];a.deny=[]}
a.role=sel.value;if(npw&&npw.value)a.pin=hs(npw.value);save();toast('✅ Compte mis à jour');render()}
else if(b.dataset.acrm){const aid=b.dataset.acrm,a=ACC().find(x=>x.id==aid);if(!a)return;
if(a.role=='Administrateur'&&ACC().filter(x=>x.role=='Administrateur').length<=1)return toast('Impossible : au moins un compte Administrateur doit exister.');
if(ui.arm!='acrm'+aid){ui.arm='acrm'+aid;b.textContent='Confirmer ?';return}
ui.arm='';S.accounts=ACC().filter(x=>x.id!=aid);if(sess==aid){sess=null;try{sessionStorage.removeItem('yt_sess')}catch(e){}}save();toast('Compte retiré');render()}
else if(b.dataset.acx){ui.pac=ui.pac==b.dataset.acx?null:b.dataset.acx;render()}
else if(b.dataset.acps){const aid=b.dataset.acps,a=ACC().find(x=>x.id==aid);if(!a)return;
const base=new Set((RM[a.role]||'').split(' ').filter(Boolean)),chosen=new Set([...document.querySelectorAll('input[data-acm]')].filter(c=>c.checked).map(c=>c.dataset.acm));
a.extra=[...chosen].filter(k=>!base.has(k));a.deny=[...base].filter(k=>!chosen.has(k));
const roEl=document.querySelector('input[data-acro]');a.ro=!!(roEl&&roEl.checked);
a.noEntry=[...document.querySelectorAll('input[data-acne]')].filter(c=>!c.checked).map(c=>c.dataset.acne);
a.mask=[...document.querySelectorAll('input[data-acmk]')].filter(c=>c.checked).map(c=>c.dataset.acmk);
save();toast('✅ Accès mis à jour');render()}});
const rL=render;render=function(){rL();
if(loginOn()&&!curAcc()){$('#main').innerHTML=loginPanel();$('#nav').style.opacity='.35';$('#nav').style.pointerEvents='none';$('#rb').textContent='';$('#lgout').style.display='none';$('#ttl').textContent='';$('#per').style.display='none';return}
if(loginOn()&&curAcc()){document.querySelectorAll('#nav a').forEach(a=>{if(!localCan(a.dataset.v))a.remove()});document.querySelectorAll('#nav h3').forEach(h=>{if(!h.nextElementSibling||h.nextElementSibling.tagName!='A')h.remove()});
$('#rb').textContent='👤 '+curAcc().name+' · '+curAcc().role;$('#lgout').style.display='';
if(!localCan(ui.v)){ui.v='dash';return render()}
const a=curAcc();
if(a.role!='Administrateur'){
const mk=new Set(a.mask||[]);
if(mk.size){
const maskCols=hs=>{document.querySelectorAll('#main table').forEach(t=>{const ths=[...t.querySelectorAll('th')],idx=[];ths.forEach((th,i)=>{if(hs.some(h=>th.textContent.trim().toLowerCase()==h.toLowerCase()))idx.push(i)});if(!idx.length)return;t.querySelectorAll('tbody tr').forEach(tr=>idx.forEach(i=>{const td=tr.children[i];if(td)td.innerHTML='<span class="mute">•••</span>'}))})};
const maskTiles=ls=>document.querySelectorAll('#main .k').forEach(k=>{const sp=k.querySelector('span');if(sp&&ls.includes(sp.textContent.trim())){const b=k.querySelector('b');if(b)b.textContent='•••';const i=k.querySelector('i');if(i)i.remove()}});
if(mk.has('cost')){maskCols(['Prix d’achat','Marge','Valeur','Valeur de l’écart']);maskTiles(['Marge brute','Taux de marge','Valeur du stock'])}
if(mk.has('sal'))maskTiles(['Trésorerie']);
}
}
if(!localCanEnter(ui.v)){
document.querySelectorAll('#main form[data-f]').forEach(f=>f.remove());
document.querySelectorAll('#main [data-x],#main [data-mx],#main [data-sd],#main [data-del],#main [data-ed],#main [data-sp],#main [data-spall],#main [data-scd],#main [data-pogsave],#main [data-bgm]').forEach(el=>el.remove());
document.querySelectorAll('#main [data-act="pay"]').forEach(b=>{const w=b.closest('span')||b;w.remove()});
document.querySelectorAll('#main input[data-pog]').forEach(inp=>inp.disabled=true);
const bk=$('#bk');if(bk)bk.readOnly=true;
if(!$('#main .ro-note'))$('#main').insertAdjacentHTML('afterbegin','<div class="box ro-note" style="margin-bottom:12px;border-left:5px solid var(--mute)"><p class="mute" style="margin:0">👁️ Accès en lecture seule pour ce module : consultation uniquement, aucune saisie.</p></div>');
}
}
else{$('#lgout').style.display='none'}};
})();
// ---- page d'aide : guide d'utilisation ----
(()=>{
NAV.push(['❓ Aide',[['aide','📖 Guide d’utilisation']]]);
TT.aide='📖 Guide d’utilisation';
const D=(t,h,o)=>`<details class="box" style="margin-bottom:10px"${o?' open':''}><summary style="cursor:pointer;font-weight:600;font-size:15px">${t}</summary><div style="margin-top:10px;line-height:1.6">${h}</div></details>`;
V.aide=()=>`<p class="mute">Ce guide explique le fonctionnement de chaque module de <b>Y-TRADE &amp; SERVICES SARL</b>. Cliquez sur un titre pour déplier la section.</p>`
+D('🧭 Prise en main','<p>Le menu à gauche donne accès à tous les modules, regroupés par thème (Pilotage, Opérations, Tiers, Stock, Finances, Données). Le titre de la page en haut indique où vous êtes.</p><ul><li><b>🔎 Recherche</b> : sur les listes (ventes, achats, clients…), un champ de recherche filtre les lignes du tableau en tapant un mot.</li><li><b>Filtre « Réglé / Non réglé »</b> : disponible sur certaines listes pour n’afficher que les factures payées ou impayées.</li><li><b>Période</b> : en haut des modules Ventes, Achats, Charges, Tableau de bord et Compte de résultat, un sélecteur permet de changer la période affichée (jour, semaine, mois, trimestre, année, ou dates personnalisées).</li><li><b>↩️ Annuler</b> (icône en haut) : annule la dernière opération effectuée (ajout, modification, suppression).</li><li><b>🌓</b> et les pastilles de couleur : changent le thème clair/sombre et la couleur d’accent de l’application.</li><li><b>🔊 Lire</b> : lit la page à voix haute (utile en déplacement ou pour les malvoyants).</li><li><b>🗑️ Supprimer</b> : un premier clic demande confirmation (« Confirmer ? »), il faut cliquer une seconde fois pour valider — évite les suppressions accidentelles.</li></ul>',1)
+D('📊 Tableau de bord','<p>Vue d’ensemble de la période sélectionnée : chiffre d’affaires, achats, marge, charges, résultat, trésorerie, valeur du stock, créances et dettes. Un graphique montre l’évolution des 6 derniers mois. Cliquer sur un indicateur ouvre directement le module correspondant.</p>')
+D('📑 Compte de résultat &amp; 📝 Rapport auto','<p><b>Compte de résultat</b> : détail du chiffre d’affaires, du coût des marchandises vendues, de la marge et des charges sur la période choisie.</p><p><b>Rapport auto</b> : synthèse textuelle prête à copier (pour WhatsApp) ou à télécharger en .txt — reprend les chiffres clés et quelques alertes (stock bas, retards de paiement…).</p>')
+D('🛒 Ventes / 📦 Achats / 💸 Charges','<p>Formulaire en haut pour enregistrer une nouvelle opération (client/fournisseur, produit, quantité, prix, montant déjà payé, mode de paiement). Le tableau en dessous liste l’historique ; chaque ligne peut être modifiée (✏️) ou supprimée (🗑️, double clic pour confirmer). Le montant restant dû est calculé automatiquement à partir du montant payé.</p>')
+D('🧾 Factures &amp; BL','<p>Retrouve toutes les factures et bons de livraison générés à partir des ventes/achats. Recherche et filtre « soldée / non soldée » disponibles.</p>')
+D('👥 Clients / 🚚 Fournisseurs','<p>Carnet d’adresses : nom et téléphone. Ces fiches sont utilisées dans les formulaires de vente/achat et dans les rapports (top clients, dettes fournisseurs…).</p>')
+D('👔 Personnel','<p>Liste des employés (poste, téléphone, date d’embauche, salaire mensuel). Le bouton « Payer » enregistre le versement d’un salaire en trésorerie ; « Payer les salaires du mois » règle tout le monde en une fois.</p>')
+D('🏷️ Produits / 🗃️ Stock / 🧮 Inventaire','<p><b>Produits</b> : nom, catégorie, unité, prix d’achat et de vente, seuil minimum, stock initial. <b>Stock</b> : quantité disponible pour chaque produit (calculée à partir des achats et ventes), avec alerte quand le stock passe sous le seuil minimum. Un export CSV des mouvements de stock (entrées/sorties) est disponible pour la période choisie.</p><p><b>Inventaire</b> : permet de comparer le stock théorique (calculé) au stock réellement compté. Renseignez le stock compté pour les produits vérifiés, laissez vide les autres, puis validez : le stock est corrigé pour correspondre au comptage et l’écart (quantité et valeur) est conservé dans un historique consultable et exportable en CSV.</p>')
+D('💰 Créances / 🧾 Dettes / 🏦 Trésorerie','<p><b>Créances</b> : sommes que les clients doivent encore payer, classées par ancienneté. <b>Dettes</b> : sommes dues aux fournisseurs. <b>Trésorerie</b> : soldes Espèces / Banque / Mobile Money, avec possibilité d’ajouter un mouvement manuel (encaissement, décaissement) ou un transfert entre modes de paiement.</p>')
+D('🏛️ Rapport de direction','<p>Rapport complet et détaillé (résumé exécutif, indicateurs, ventes par produit, clients, fournisseurs, stock, créances/dettes par ancienneté, trésorerie) prêt à télécharger en HTML (imprimable en PDF depuis le navigateur), à copier, ou à partager par WhatsApp/e-mail.</p>')
+D('📥 Import / Export &amp; sauvegardes','<p><b>Export</b> : chaque module de données peut être exporté en CSV ; « Tout (JSON) » télécharge une sauvegarde complète des données.</p><p><b>Import</b> : un fichier CSV ou une sauvegarde JSON peut être réimporté pour restaurer ou compléter les données.</p><p><b>Excel (.xlsx)</b> : exporte toutes les données dans un classeur à plusieurs feuilles, modifiable puis réimportable.</p><p><b>🗓️ Points de sauvegarde hebdomadaires</b> : un point est enregistré automatiquement chaque semaine (dès qu’il y a des données). La liste, consultable dans <b>⚙️ Données</b>, permet de voir un aperçu chiffré de chaque semaine (👁️ Aperçu), de la télécharger, ou de <b>restaurer</b> l’ensemble des données à l’état de cette semaine-là — les 26 dernières semaines sont conservées, et un point peut aussi être créé manuellement à tout moment.</p><p><b>🌐 Sauvegarde HTML complète</b> : télécharge un seul fichier .html contenant l’application <b>et</b> toutes les données — à conserver sur une clé USB, par e-mail ou sur un Drive ; il suffit de l’ouvrir dans un navigateur pour tout retrouver.</p><p><b>☁️ OneDrive</b> : envoie la sauvegarde par e-mail pré-rempli vers une adresse Outlook/OneDrive.</p><p class="mute">Conseil : faites une sauvegarde régulièrement, surtout avant une manipulation importante.</p>')
+D('🔒 Sécurité et accès','<p>Trois niveaux de protection, cumulables, se règlent dans <b>⚙️ Données</b> :</p><ul><li><b>Verrouillage de l’application</b> : un seul mot de passe protège l’accès à toute l’application.</li><li><b>Verrouillage par module</b> : un mot de passe distinct peut être défini pour un module précis (ex. Trésorerie), redemandé à chaque nouvelle ouverture.</li><li><b>👤 Comptes &amp; accès</b> : page de connexion avec identifiants nominatifs et rôles (Administrateur, Ventes, Achats, Comptabilité) — chaque rôle ne voit que les modules qui le concernent. Dès qu’un compte est créé, la connexion devient obligatoire pour tout le monde. Pour un compte non-administrateur, le bouton <b>🔧 Personnaliser les accès</b> permet d’ajuster finement ses modules visibles : cocher un module en plus <b>étend</b> l’accès au-delà de ce que donne le rôle, en décocher un <b>restreint</b> l’accès en-deçà — utile pour donner un accès ponctuel à un module supplémentaire ou, au contraire, cacher un module sensible à une personne précise sans changer son rôle.</li></ul><p>Le bouton <b>👁️ Lecture seule</b> dans l’en-tête (accessible sans mot de passe, même sur l’écran de connexion) donne un accès instantané au Tableau de bord, au Compte de résultat et au Rapport de direction, sans possibilité de modifier quoi que ce soit ni de voir les autres modules. Pratique pour montrer les chiffres à un tiers (associé, banquier…) sans lui donner de compte. Le bouton <b>✖️ Quitter la lecture seule</b> permet d’en sortir.</p>')
+D('🎯 Budget / 📦 Objectifs produits / 🔮 Scénarios','<p><b>Budget</b> : fixez, mois par mois, un objectif de chiffre d’affaires et un budget par catégorie de charges. Le module compare ensuite ces objectifs au réel sur la période affichée en haut de page (les mois budgétisés inclus dans cette période sont additionnés automatiquement).</p><p><b>Objectifs produits</b> : fixez un objectif de quantité à vendre par produit pour un mois donné, comparé aux ventes réelles de la période affichée (quantité, chiffre d’affaires estimé et réalisé, % atteint).</p><p><b>Scénarios</b> : simulez l’effet d’une variation de prix de vente, de volume vendu, de coût d’achat ou de charges sur la marge et le résultat, à partir des chiffres réels de la période affichée. Chaque simulation peut être nommée et enregistrée pour être comparée aux autres plus tard (👁️ Détail affiche le calcul complet, 🗑️ la supprime).</p>')

(()=>{

function snapStats(js){try{const d=JSON.parse(js);return{ca:sum(d.sales,'total'),ac:sum(d.purchases,'total'),ch:sum(d.expenses,'amount'),tr:sum(d.mv,'amt'),nv:d.sales.length,na:d.purchases.length,np:d.products.length,ncl:d.clients.length}}catch(e){return null}}
const fx0=fix;fix=function(){fx0();const wk=mondayOf(new Date());if(!SN().some(x=>x.week==wk)&&hasData()){SN().push({id:id(),week:wk,createdAt:new Date().toISOString(),json:snapData()});SN().sort((a,b)=>a.week.localeCompare(b.week));while(SN().length>26)SN().shift();save()}};

const prev=open?(st?`<div class="kg" style="margin:8px 0 0">${K('Chiffre d’affaires',fmt(st.ca))}${K('Achats',fmt(st.ac))}${K('Charges',fmt(st.ch))}${K('Trésorerie (mouvements)',fmt(st.tr))}${K('Ventes enregistrées',st.nv)}${K('Achats enregistrés',st.na)}${K('Produits',st.np)}${K('Clients',st.ncl)}</div>`:'<p class="mute" style="margin:8px 0 0">Aperçu indisponible.</p>'):'';

return `<div class="box" style="margin-bottom:12px"><h2>🗓️ Points de sauvegarde hebdomadaires</h2><p class="mute">Un point de sauvegarde est créé automatiquement au début de chaque semaine (dès qu’il y a des données). Consultez son contenu avec 👁️ Aperçu, téléchargez-le, ou restaurez-le pour revenir à l’état de cette semaine-là — les 26 dernières semaines sont conservées.</p><div class="tools"><button class="ghost" data-snnow="1">📌 Créer un point maintenant</button></div>${list.length?rows:'<p class="mute">Aucun point de sauvegarde pour l’instant.</p>'}</div>`}
const bkS0=V.bak;V.bak=()=>snapPanel()+bkS0();
document.addEventListener('click',e=>{const b=e.target.closest('[data-snx],[data-snd],[data-snr],[data-snrm],[data-snnow]');if(!b)return;
if(b.dataset.snx){ui.snx=ui.snx==b.dataset.snx?null:b.dataset.snx;return render()}
if(b.dataset.snd){const s=SN().find(x=>x.id==b.dataset.snd);if(!s)return;return download('y-trade-semaine-'+s.week+'.json',s.json,'application/json;charset=utf-8')}
if(b.dataset.snnow){const wk=mondayOf(new Date()),ex=SN().find(x=>x.week==wk),snap={id:ex?ex.id:id(),week:wk,createdAt:new Date().toISOString(),json:snapData()};if(ex)Object.assign(ex,snap);else{SN().push(snap);SN().sort((a,b)=>a.week.localeCompare(b.week))}save();toast('✅ Point de sauvegarde créé');return render()}
if(b.dataset.snr){const key='snr'+b.dataset.snr;if(ui.arm!=key){ui.arm=key;return render()}ui.arm='';const s=SN().find(x=>x.id==b.dataset.snr);if(!s)return;const keep=S.snaps;S=JSON.parse(s.json);S.snaps=keep;fix();save();render();return toast('✅ Données restaurées — semaine du '+new Date(s.week).toLocaleDateString('fr-FR'))}
if(b.dataset.snrm){const key='snrm'+b.dataset.snrm;if(ui.arm!=key){ui.arm=key;return render()}ui.arm='';S.snaps=SN().filter(x=>x.id!=b.dataset.snrm);save();render();return toast('Point de sauvegarde supprimé')}
});
})();

if(!lines.length)return toast('Renseignez au moins un stock compté.');

// ---- tableau de bord enrichi : indicateurs commerciaux, tendances 12 mois & projection ----
(()=>{
const lreg=pts=>{const n=pts.length,sx=pts.reduce((t,p)=>t+p.x,0),sy=pts.reduce((t,p)=>t+p.y,0),sxy=pts.reduce((t,p)=>t+p.x*p.y,0),sxx=pts.reduce((t,p)=>t+p.x*p.x,0),d=n*sxx-sx*sx;if(!d)return{a:n?sy/n:0,b:0};const b=(n*sxy-sx*sy)/d,a=(sy-b*sx)/n;return{a,b}};
const trend=(v,ref)=>{const d=v-ref;if(Math.abs(d)<=Math.max(1,Math.abs(ref)*.02))return'<i class="mute">Stable</i>';return d>0?'<i class="pos">▲ En hausse</i>':'<i class="neg">▼ En baisse</i>'};
const d1=V.dash;
V.dash=()=>{
const a=agg(rng(ui.p,0));
const nbCli=new Set(a.s.map(x=>x.clientId)).size,qte=sum(a.s,'qty'),panier=a.s.length?a.ca/a.s.length:0;
const commerce=`<div class="box" style="margin-top:12px"><h2>🧮 Indicateurs commerciaux (période)</h2><div class="kg">${K('Nombre de ventes',a.s.length)}${K('Panier moyen',fmt(panier))}${K('Clients actifs',nbCli)}${K('Quantité vendue',qte.toLocaleString('fr-FR'))}</div></div>`;
const months=[...Array(12).keys()].map(i=>i-11).map(o=>{const r=rng('month',o),ag=agg(r);return{l:new Date(r[0]+'T00:00:00').toLocaleDateString('fr-FR',{month:'short'}),ca:ag.ca,res:ag.res}});
const caPts=months.map((m,i)=>({x:i,y:m.ca})),resPts=months.map((m,i)=>({x:i,y:m.res}));
const rCa=lreg(caPts),rRes=lreg(resPts),projCa=Math.max(0,rCa.a+rCa.b*12),projRes=rRes.a+rRes.b*12;
const lastCa=months[months.length-1].ca,lastRes=months[months.length-1].res;
const trends=`<div class="g2" style="margin-top:12px">${chartBox('📈 Chiffre d’affaires — 12 derniers mois',vline(months.map(m=>({l:m.l,v:m.ca,vf:fmt(m.ca)})),{label:'CA mensuel sur 12 mois'}))}${chartBox('📈 Résultat net — 12 derniers mois',vline(months.map(m=>({l:m.l,v:m.res,vf:fmt(m.res)})),{label:'Résultat net mensuel sur 12 mois'}))}</div>`;
const proj=`<div class="box" style="margin-top:12px"><h2>🔮 Projection du mois prochain</h2><p class="trend-note">Estimation basée sur la tendance linéaire des 12 derniers mois — à titre indicatif, hors événements exceptionnels (ruptures de stock, saisonnalité forte, etc.).</p><div class="kg">${K('Chiffre d’affaires estimé',fmt(projCa),trend(projCa,lastCa))}${K('Résultat net estimé',fmt(projRes),trend(projRes,lastRes))}</div></div>`;
return d1()+commerce+trends+proj
};

document.addEventListener('click',async e=>{const b=e.target.closest('[data-yfb-login],[data-yfb-logout],[data-yfb-guest]');if(!b)return;const f=FB();if(!f)return toast('⚠️ Firebase indisponible.');if(b.dataset.yfbGuest){guest=true;fbReady=true;bootDone=true;ui.v='dash';render();return}if(b.dataset.yfbLogout){try{await f.signOut(f.auth)}catch(x){toast('❌ Déconnexion impossible.')}return}const em=($('#fbEmail')||{}).value?.trim()||'',pw=($('#fbPassword')||{}).value||'';if(!em)return toast('Entrez votre adresse e-mail.');if(!pw)return toast('Entrez votre mot de passe.');b.disabled=true;b.textContent='⏳ Connexion...';try{await f.signInWithEmailAndPassword(f.auth,em,pw)}catch(x){b.disabled=false;b.textContent='🔓 Se connecter';toast(x.code==='auth/invalid-credential'?'E-mail ou mot de passe incorrect.':'❌ '+(x.message||'Connexion impossible.'))}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-yhtml],[data-yshare],[data-ym-send]');if(!b)return;if(b.dataset.ymSend)return sendMessage();if(b.dataset.yhtml==='save'){dlhtml('Y-TRADE-'+today+'-'+hm(new Date())+'.html',htmlBackup());toast('🌐 Sauvegarde HTML complète générée');return}if(b.dataset.yhtml==='load'){return $('#yHtmlFile')?.click()}if(b.dataset.yshare){const txt=ui.v==='rap'?window.__ytradeReportText||'Rapport Y-TRADE': 'Sauvegarde HTML complète de Y-TRADE & SERVICES SARL';const bl=new Blob([ui.v==='dir'&&typeof buildDirReportHTML==='function'?buildDirReportHTML():htmlBackup()],{type:'text/html'});await share('Y-TRADE & SERVICES SARL',txt,bl,'Y-TRADE-'+(ui.v==='dir'?'rapport-':'')+today+'.html')}});
document.addEventListener('input',e=>{if(e.target.id==='yMsgInput'){const c=$('#yMsgCount');if(c)c.textContent=e.target.value.length+' / 2000'}});document.addEventListener('keydown',e=>{if(e.target?.id==='yMsgInput'&&e.ctrlKey&&e.key==='Enter'){e.preventDefault();sendMessage()}});
document.addEventListener('change',e=>{if(e.target.id!=='yHtmlFile')return;const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=new DOMParser().parseFromString(String(r.result),'text/html'),n=d.querySelector('#y-trade-backup');if(!n)throw Error();const p=JSON.parse(n.textContent||'');if(!p.data||!Array.isArray(p.data.products)||!Array.isArray(p.data.sales))throw Error();try{localStorage.setItem(LOCAL_BACKUP_KEY,JSON.stringify(S))}catch(e){}norm(p.data);save();render();toast('✅ Sauvegarde HTML restaurée')}catch(x){toast('❌ Fichier HTML de sauvegarde invalide.')}e.target.value='';};r.readAsText(f)});
const baseRender=render;render=function(){ensureHeader();if(!fbReady){$('#main').innerHTML=loadingPanel();$('#nav').style.opacity='.35';$('#nav').style.pointerEvents='none';return}if(!fbUser&&!guest){$('#main').innerHTML=loginPanel();$('#nav').style.opacity='.35';$('#nav').style.pointerEvents='none';$('#ttl').textContent='';$('#per').style.display='none';$('#rb').textContent='☁️ Firebase';$('#yLogout').style.display='none';return}const oldAccounts=S.accounts;S.accounts=[];try{baseRender()}finally{S.accounts=oldAccounts}document.querySelectorAll('#nav a').forEach(a=>{if(!can(a.dataset.v))a.remove()});document.querySelectorAll('#nav h3').forEach(h=>{if(!h.nextElementSibling||h.nextElementSibling.tagName!=='A')h.remove()});if(!can(ui.v)){ui.v=guest?'dash':DEFV[fbProfile?.role]||'dash';const oa=S.accounts;S.accounts=[];try{baseRender()}finally{S.accounts=oa}}$('#nav').style.opacity='';$('#nav').style.pointerEvents='';$('#rb').textContent=guest?'👁️ Visiteur · Lecture seule':'👤 '+(fbProfile?.name||fbUser?.email||'Utilisateur')+' · '+(fbProfile?.role||'');$('#yLogout').style.display=guest?'none':'';cleanShare();applyMask();applyRO();if(conflict&&!$('#yConflictNote'))$('#main').insertAdjacentHTML('afterbegin','<div id="yConflictNote" class="box" style="margin-bottom:12px;border-left:5px solid var(--neg)"><b>⚠️ Conflit de synchronisation</b><p class="mute">Une version cloud plus récente existe. Vos données locales sont conservées.</p></div>')};
async function init(){const f=FB();if(!f){fbReady=true;render();return}f.onAuthStateChanged(f.auth,async u=>{fbUser=u||null;fbProfile=null;guest=false;fbReady=false;bootDone=false;if(!u){fbReady=true;render();return}try{const s=await f.getDoc(f.doc(f.db,'users',u.uid));if(!s.exists())throw Error('Aucun profil Firestore associé à ce compte.');const d=s.data()||{};if(d.actif===false){await f.signOut(f.auth);throw Error('Ce compte est désactivé.')}fbProfile={uid:u.uid,id:u.uid,email:u.email||'',name:d.nom||d.name||u.email||'Utilisateur',role:d.role||'Ventes',actif:d.actif!==false,extra:Array.isArray(d.extra)?d.extra:[],deny:Array.isArray(d.deny)?d.deny:[],ro:!!d.ro,noEntry:Array.isArray(d.noEntry)?d.noEntry:[],mask:Array.isArray(d.mask)?d.mask:[]};fbReady=true;ui.v=DEFV[fbProfile.role]||'dash';render();await bootstrap();startMessages()}catch(e){fbUser=null;fbProfile=null;fbReady=true;render();toast('⚠️ '+(e.message||'Connexion impossible.'))}})}
if(FB())init();else window.addEventListener('ytrade-firebase-ready',init,{once:true});
